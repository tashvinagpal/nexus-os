# NEXUS settings. Security rules live in policy.toml, not here.
# A typo or unknown setting stops NEXUS from starting (it never guesses).

[ai]
ollama_url = "http://127.0.0.1:11434"

# NEXUS works fully offline. No cloud AI provider exists yet; this switch
# must be turned on explicitly before one could ever be used.
allow_cloud = false

# On a laptop running on battery, skip heavy models.
power_saving_on_battery = true

# Unload the language model after this many idle seconds to free memory.
# Lower = less memory held, but the next answer waits for a reload
# (measured on this PC: llama3.1:8b cold load 22 s, llama3.2 3 s).
llm_idle_unload_seconds = 300

# Keep the language model loaded all the time for instant answers.
# Costs ~5 GB VRAM permanently. Game mode still unloads it.
keep_llm_loaded = false

# Language models, best first. For each request NEXUS uses the first one that
# is installed and fits in the RAM/VRAM free *right now* (keeping the reserves
# below). Sizes were measured on this PC - see docs/architecture.md.
# Nothing is downloaded automatically.

[[ai.llm]]
model = "llama3.1:8b"
placement = "gpu"
vram_mb = 5100
ram_mb = 500

[[ai.llm]]
model = "llama3.2"
placement = "gpu"
vram_mb = 2500
ram_mb = 800

# CPU-only fallback: used in game mode (GPU stays free for the game) or when
# VRAM is full. Slower (17 tokens/s measured) but works.
[[ai.llm]]
model = "llama3.2"
placement = "cpu"
ram_mb = 2500

[resources]
# Memory NEXUS always leaves free for your own apps and games.
ram_reserve_mb = 2048
vram_reserve_mb = 1024

[apps]
# How long to wait for a launched app / game process before saying it couldn't be verified.
# Games can take a while (GTA V starts through the Rockstar launcher).
app_launch_timeout_seconds = 20
game_launch_timeout_seconds = 180

# Enter game mode (unload AI models from the GPU) before launching a game, and whenever a known
# game is running. Leaves game mode when the game exits; AI models reload only when next needed.
auto_game_mode = true
watch_games = true

# Include Store apps (Calculator, Settings, WhatsApp...). Found with a read-only Windows query.
store_apps = true

[voice]
# Speech-to-text (push-to-talk: /listen, or Enter on an empty line). Runs locally; audio never
# leaves this PC and is never saved. Voice grants nothing by itself: the same security policy
# and confirmations apply as for typed text.
enabled = true

# "auto" = any suitable microphone, chosen automatically (the Windows default *communications*
# microphone first, then the default one, then any other). Or part of a device name, e.g. "AirPods".
# Loopback inputs (Stereo Mix) are never used; virtual ones (e.g. iVCam) only if named here.
microphone = "auto"

# Languages NEXUS listens for (Whisper codes). Haryanvi is recognised as Hindi.
languages = ["en", "hi", "pa"]
language = "auto"      # or one of the above to skip language detection

# Hindi/Punjabi are written by the model in Devanagari/Gurmukhi; turn them into romanized
# Hinglish/Punjabi ("chala de") - the form the fast path and planner were tested with.
romanize = true

# Unload the speech model after this many idle seconds (it reloads in 1-3 s, while you speak).
stt_idle_unload_seconds = 60
transcribe_timeout_seconds = 30

# Listening always ends by itself.
max_utterance_seconds = 15
no_speech_timeout_seconds = 6
end_silence_ms = 900

# Below this the words are shown but not acted on ("please say it again").
min_confidence = 0.4
# A spoken "yes" approves an action only if heard at least this clearly (else: say it again / type it).
confirm_min_confidence = 0.6

# Check for connected/disconnected microphones every N seconds (~5 ms per check). 0 = only on /listen.
device_poll_seconds = 5

# Speech-to-text models, best first. Each is used only if it is downloaded and fits in memory
# right now. Download: .venv\Scripts\python.exe scripts\get_stt_model.py small
# Sizes measured on this PC (i5-12400F, CPU int8) - see docs/voice.md. threads = 0: automatic.

[[voice.stt]]
model = "small"        # 463 MB on disk; ~380 MB RAM loaded, ~545 MB while transcribing; ~1.2 s
placement = "cpu"
compute_type = "int8"
threads = 0
ram_mb = 560

# Light option: used while a game runs (2 CPU threads, no GPU) or when memory is short.
[[voice.stt]]
model = "base"         # 141 MB on disk; ~195 MB RAM loaded, ~310 MB while transcribing
placement = "cpu"
compute_type = "int8"
threads = 2
ram_mb = 320
game_mode = true

[tts]
# Voice output: NEXUS speaks its replies through the Windows default audio output (speakers,
# headphones...). Local and offline; nothing is sent anywhere. The text is always shown too,
# and typing or talking interrupts it (/stop, /tts off). Speech never runs anything.
enabled = true
provider = "kokoro"

# Kokoro-82M model file. Download: .venv\Scripts\python.exe scripts\get_tts_model.py fp32
# Measured on this PC (i5-12400F, CPU): fp32 ~0.5 s per short sentence, ~570 MB RAM while loaded;
# int8 uses ~370 MB but is 3x slower here. See docs/tts.md.
model = "fp32"

# Voices (Kokoro names). English: af_heart, af_bella, am_michael... Hindi: hf_alpha, hf_beta, hm_omega, hm_psi.
voice = "af_heart"
hindi_voice = "hf_alpha"

# Hinglish/Punjabi written in English letters: "hindi" converts it to Devanagari for the Hindi voice
# (much clearer); "english" reads it with the English voice.
romanized = "hindi"

speed = 1.0
volume = 1.0
placement = "cpu"      # the GPU is left to games and the language model
threads = 0            # 0 = automatic
ram_mb = 600           # measured peak of the voice process
idle_unload_seconds = 120

# While a game runs: "quiet" (text only, the voice model is freed) or "speak".
game_mode = "quiet"

# Longer replies are spoken up to about this many characters, then "The rest is on the screen."
max_spoken_chars = 600
