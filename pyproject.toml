[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-os"
dynamic = ["version"]
description = "NEXUS OS - an AI-native operating system (v0.1 Windows development prototype)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "psutil>=5.9",
    "cryptography>=42",  # Ed25519 device identities and message signatures
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Voice input (subsystem 5): local speech-to-text and microphone capture. ~275 MB installed.
# Models are downloaded separately: scripts/get_stt_model.py
voice = ["faster-whisper>=1.1,<2", "sounddevice>=0.4.6"]
# Voice output (subsystem 6): Kokoro text-to-speech (uses the onnxruntime/numpy from [voice]).
# ~10 MB of packages; the model is downloaded separately: scripts/get_tts_model.py fp32
tts = ["kokoro-onnx>=0.4,<1", "sounddevice>=0.4.6"]

[project.scripts]
nexus = "nexus.__main__:main"

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.packages.find]
include = ["nexus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: uses the real GPU and Ollama models (loads/unloads llama3.1:8b); run with: pytest -m live",
    "voice: real speech-to-text models on synthetic speech (needs scripts/get_stt_model.py base small); pytest -m voice",
    "mic: needs a physical microphone connected; pytest -m mic",
    "tts: the real text-to-speech model, no sound played (needs scripts/get_tts_model.py fp32); pytest -m tts",
    "speaker: plays through the real audio output (you will hear it); pytest -m speaker",
]
addopts = "-m \"not live and not voice and not mic and not tts and not speaker\""
